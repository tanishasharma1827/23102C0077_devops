<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <div th:replace="~{fragments :: messages}"></div>
    <section class="auth">
        <div class="side" th:style="'background-image:url(' + @{/img/badminton.jpg} + ')'">
            <h2>Welcome back</h2>
            <p>Sign in to book a slot, track your requests or manage bookings.</p>
        </div>
        <div class="form">
            <div class="eyebrow">Player or manager</div>
            <h2>Sign in</h2>
            <form id="signin-form" th:action="@{/signin}" method="post">
                <label for="signin-email">Email</label>
                <input id="signin-email" type="email" name="email" required placeholder="you@example.com">
                <button id="signin-submit" type="submit" class="button">Sign in</button>
            </form>
            <p class="demo-hint">Demo manager: <code>manager@sports.local</code><br>
                Demo player with history: <code>aarav@demo.local</code></p>
            <p class="muted">New here? <a th:href="@{/register}">Create an account</a></p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
