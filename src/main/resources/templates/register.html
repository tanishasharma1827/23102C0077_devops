<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <section class="card">
        <h2>Create your account</h2>
        <form id="register-form" th:action="@{/register}" th:object="${user}" method="post" novalidate>
            <label for="name">Full name</label>
            <input id="name" type="text" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}">
            <p id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="phone">Phone (10 digits)</label>
            <input id="phone" type="text" th:field="*{phone}">
            <p id="phone-error" class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>

            <button id="register-submit" type="submit" class="button">Register</button>
        </form>
        <p>Already registered? <a th:href="@{/signin}">Sign in</a></p>
    </section>
</main>
</body>
</html>
