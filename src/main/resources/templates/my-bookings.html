<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('My bookings')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <div th:replace="~{fragments :: messages}"></div>
    <h2>My bookings</h2>
    <p id="no-bookings" th:if="${#lists.isEmpty(bookings)}">You have no bookings yet.
        <a th:href="@{/facilities}">Book a slot</a></p>
    <table id="bookings-table" th:unless="${#lists.isEmpty(bookings)}">
        <thead>
        <tr><th>#</th><th>Facility</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="b : ${bookings}" th:id="'booking-' + ${b.id}">
            <td th:text="${b.id}">1</td>
            <td th:text="${b.slot.facility.name}">Badminton Court 1</td>
            <td th:text="${b.slot.date}">2026-10-14</td>
            <td th:text="${b.slot.label}">06:00 - 07:00</td>
            <td class="status" th:id="'status-' + ${b.id}" th:text="${b.status}">REQUESTED</td>
            <td>
                <form th:if="${b.active}" th:action="@{/bookings/{id}/cancel(id=${b.id})}" method="post" class="inline">
                    <button th:id="'cancel-' + ${b.id}" type="submit" class="button danger">Cancel</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
