<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <section class="blocked">
        <span class="big-icon"><svg th:replace="~{fragments :: icon('alert')}"></svg></span>
        <div>
            <h3>Something went wrong</h3>
            <p id="error-text" th:text="${error}">Error</p>
            <a class="button small" th:href="@{/facilities}">Back to facilities</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
