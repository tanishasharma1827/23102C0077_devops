<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Sports Facility Booking'">Sports Facility Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="nav">
    <a class="brand" th:href="@{/}">SportsBook</a>
    <a id="nav-home" th:href="@{/}">Home</a>
    <a id="nav-facilities" th:href="@{/facilities}">Book a Slot</a>
    <a id="nav-my-bookings" th:if="${currentUser != null}" th:href="@{/bookings/mine}">My Reservations</a>
    <a id="nav-manager" th:if="${currentUser != null and currentUser.role.name() == 'MANAGER'}" th:href="@{/manager/bookings}">Manager</a>
    <span class="spacer"></span>
    <th:block th:if="${currentUser == null}">
        <a id="nav-register" th:href="@{/register}">Register</a>
        <a id="nav-signin" th:href="@{/signin}">Sign in</a>
    </th:block>
    <th:block th:if="${currentUser != null}">
        <span id="nav-user" th:text="'Hi, ' + ${currentUser.name}">Hi</span>
        <form th:action="@{/signout}" method="post" class="inline">
            <button id="nav-signout" type="submit" class="link">Sign out</button>
        </form>
    </th:block>
</nav>

<div th:fragment="messages">
    <p id="flash-message" class="alert success" th:if="${message}" th:text="${message}"></p>
    <p id="flash-error" class="alert error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
