spring.application.name=sports-booking
# 8081 locally because Jenkins uses 8080 on this machine; Docker/Tomcat set SERVER_PORT=8080
server.port=${SERVER_PORT:8081}

# In-memory H2 database for local development
spring.datasource.url=jdbc:h2:mem:sportsdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Health check endpoint used later by Jenkins / Docker / Ansible (Tasks 8, 12, 14)
management.endpoints.web.exposure.include=health,info

# M15: /actuator/info shows the app name and the Maven version (filled in at build time)
management.info.env.enabled=true
info.app.name=Sports Facility Booking System
info.app.version=@project.version@
